<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs>
<linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="50%" stop-color="#818cf8"/>
<stop offset="100%" stop-color="#e879f9"/>
</linearGradient>
<linearGradient id="cyanPink" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="100%" stop-color="#d946ef"/>
</linearGradient>
<linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#0b1023"/>
<stop offset="100%" stop-color="#070a16"/>
</linearGradient>
<linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#0d1428"/>
<stop offset="100%" stop-color="#070a16"/>
</linearGradient>
<radialGradient id="bgGlow" cx="70%" cy="35%" r="70%">
<stop offset="0%" stop-color="#172554"/>
<stop offset="55%" stop-color="#0b1023"/>
<stop offset="100%" stop-color="#03050d"/>
</radialGradient>
<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
<filter id="bigGlow">
<feGaussianBlur stdDeviation="18"/>
</filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity=".1"/>
</pattern>
<style>
.mono{ font-family:"Courier New",monospace; }
.cyan{ fill:#22d3ee; }
.purple{ fill:#c084fc; }
.pink{ fill:#e879f9; }
.white{ fill:#e5e7eb; }
.muted{ fill:#94a3b8; }
.green{ fill:#4ade80; }
.pulse{ animation:pulse 2.5s ease-in-out infinite; }
.dash{ animation:dash 3s linear infinite; }
.spin{ animation:spin 18s linear infinite; transform-origin:1000px 340px; }
.spin2{ animation:spin 12s linear infinite reverse; transform-origin:1000px 340px; }
.blink{ animation:blink 1s steps(2,end) infinite; }
@keyframes pulse{ 0%,100%{opacity:.45;} 50%{opacity:1;} }
@keyframes dash{ to{stroke-dashoffset:-80;} }
@keyframes spin{ to{transform:rotate(360deg);} }
@keyframes blink{ 50%{opacity:0;} }
</style>
</defs>

